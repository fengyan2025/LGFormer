[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mri-lgformer-t1"
version = "0.1.0"
description = "Stage-specialized local-global Transformer for same-grid T1w MRI enhancement"
requires-python = ">=3.10"
dependencies = [
  "einops>=0.8",
  "numpy>=1.26",
  "PyYAML>=6",
  "scikit-image>=0.25",
  "scipy>=1.15",
  "timm>=1.0",
  "torch>=2.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
