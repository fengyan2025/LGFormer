paths:
  data_root: data/HCP_paired
  train_csv: data/splits/train.csv
  validation_csv: data/splits/validation.csv
  test_csv: data/splits/test.csv
  output_dir: runs/t1_main_seed20260730

expected_inventory:
  subjects: 857
  pairs: 17140

model:
  inp_channels: 1
  out_channels: 1
  dim: 48
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 4
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2.66
  bias: false
  LayerNorm_type: WithBias
  dual_pixel_task: false
  allocation: proposed

training:
  seed: 20260730
  max_steps: 140000
  batch_size: 2
  num_workers: 4
  crop_size: 256
  learning_rate: 0.0002
  eta_min: 0.000002
  weight_decay: 0.01
  charbonnier_epsilon: 0.001
  gradient_weight: 0.1
  checkpoint_start: 50000
  checkpoint_every: 5000
  recovery_every: 2500
  log_every: 50
  cudnn_benchmark: true

safety:
  max_consecutive_overflows: 8
  max_total_overflows: 100

selection:
  split: validation
  primary_metric: mean_global_psnr
  plateau_tolerance_db: 0.01
  rule: earliest_checkpoint_within_plateau
  test_access_before_selection: forbidden
